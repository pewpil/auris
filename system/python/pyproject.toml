[project]
name = "auris"
version = "0.1.0"
description = "Auris — contract-first CV pipeline and SceneState UDP transport (Prototype stage)"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "opencv-python>=4.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "mypy>=1.10",
]

[project.scripts]
auris = "auris.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["auris"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
# RUF001/2/3: math notation (×, –, →) is deliberate in contract docs and messages.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
# numpy>=2.5 stubs use PEP 695 `type` statements (3.12+ syntax); runtime target stays 3.10+.
python_version = "3.12"
strict = true
files = ["auris"]

[tool.pytest.ini_options]
testpaths = ["tests"]
