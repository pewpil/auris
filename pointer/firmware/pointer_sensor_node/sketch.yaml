# arduino-cli sketch project definition for the Auris pointer sensor node.
# Regenerate with `arduino-cli init` if the toolchain moves on.
#
# No default_port is declared on purpose. arduino-cli aborts `compile` outright when a
# port named here is absent, which would make offline builds fail; and the CP2102
# renumbers between /dev/ttyUSB0 and /dev/ttyUSB1 across replugs anyway. Pass --port
# explicitly to `upload` and `monitor` instead.
default_fqbn: esp32:esp32:nodemcu-32s

profiles:
  pointer-sensor-node:
    fqbn: esp32:esp32:nodemcu-32s
    platforms:
      - platform: esp32:esp32 (3.3.12)
    libraries:
      - VL53L0X (1.3.1)