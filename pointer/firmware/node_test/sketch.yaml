# arduino-cli sketch project for the Auris pointer sensor-node bring-up test.
# The full node: the CJMCU-531 (VL53L1X) and the GY-521 (MPU6050) sharing one
# I2C bus at 400 kHz, plus the laser button on GPIO 18. The VL53L1X needs
# Pololu's driver; the MPU6050 is driven from raw registers per the parent
# contract, so no IMU library is pulled in.
default_fqbn: esp32:esp32:nodemcu-32s

profiles:
  node-test:
    fqbn: esp32:esp32:nodemcu-32s
    platforms:
      - platform: esp32:esp32 (3.3.12)
    libraries:
      - VL53L1X (1.3.1)
